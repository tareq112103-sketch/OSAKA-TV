name: Build OSAKA TV for Windows 11

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'playlist.m3u'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore windows/OSAKA-TV.Windows/OSAKA-TV.Windows.csproj
      - name: Publish Windows x64
        run: dotnet publish windows/OSAKA-TV.Windows/OSAKA-TV.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/windows-x64
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/windows-x64/* -DestinationPath OSAKA-TV-Windows-x64.zip
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: OSAKA-TV-Windows-11-x64
          path: OSAKA-TV-Windows-x64.zip
          if-no-files-found: error
