name: Build OSAKA TV - Windows 11

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build Windows 11 x64 app
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore windows/OSAKA-TV.Windows/OSAKA-TV.Windows.csproj
      - name: Publish self-contained Windows app
        run: dotnet publish windows/OSAKA-TV.Windows/OSAKA-TV.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/windows-x64
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path publish/windows-x64/* -DestinationPath OSAKA-TV-Windows-11-x64.zip
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: OSAKA-TV-Windows-11-x64
          path: OSAKA-TV-Windows-11-x64.zip
          if-no-files-found: error
          retention-days: 30
